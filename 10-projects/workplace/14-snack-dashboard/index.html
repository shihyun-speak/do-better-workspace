<script src="shared.js"></script>
<script>
let allRecords = [];
let officeSnacks = [];

async function init() {
  try {
    const [all, os] = await Promise.all([fetchAllRecords(), fetchOfficeSnacks()]);
    allRecords = all;
    officeSnacks = os;

    document.getElementById('data-status').textContent = `${all.length} records`;
    document.getElementById('last-updated').textContent = new Date().toLocaleTimeString('ko-KR');

    renderBudgetGauge();
    renderBudgetAlert();
    renderMonthlyChart();
    renderQuickStats();
    renderPopularItems();
    renderRestockReminder();
    renderRecentList();
    renderHistoryTable();
  } catch (err) {
    console.error(err);
    document.getElementById('data-status').textContent = 'Error';
    document.getElementById('data-status').className = 'text-[10px] font-bold py-1 px-2 bg-error/10 text-error rounded-full';
  }
}

// ── Budget Alert Banner ────────────────────────────────
function renderBudgetAlert() {
  const now = new Date();
  const { start, end } = getMonthRange(now);
  const thisMonth = officeSnacks.filter(r => r.date >= start && r.date <= end);
  const spent = thisMonth.reduce((s, r) => s + r.price, 0);
  const pct = Math.round((spent / CONFIG.BUDGET) * 100);
  const el = document.getElementById('budget-alert');

  if (pct >= 90) {
    el.className = 'bg-error/10 border border-error/20 rounded-2xl p-4 flex items-center gap-4 alert-pulse';
    el.innerHTML = `
      <span class="material-symbols-outlined text-error text-2xl">emergency</span>
      <div class="flex-1">
        <p class="font-headline font-bold text-error">Budget Critical — ${pct}% used</p>
        <p class="text-xs text-error/70">Only ${formatKRWFull(CONFIG.BUDGET - spent)} remaining. Consider pausing non-essential orders.</p>
      </div>
    `;
  } else if (pct >= 70) {
    el.className = 'bg-tertiary/10 border border-tertiary/20 rounded-2xl p-4 flex items-center gap-4';
    el.innerHTML = `
      <span class="material-symbols-outlined text-tertiary text-2xl">warning</span>
      <div class="flex-1">
        <p class="font-headline font-bold text-tertiary">Budget Caution — ${pct}% used</p>
        <p class="text-xs text-tertiary/70">${formatKRWFull(CONFIG.BUDGET - spent)} remaining with ${getDaysRemaining()} days left.</p>
      </div>
    `;
  }
}

// ── Budget Gauge ───────────────────────────────────────
function renderBudgetGauge() {
  const now = new Date();
  const { start, end } = getMonthRange(now);
  const thisMonth = officeSnacks.filter(r => r.date >= start && r.date <= end);
  const spent = thisMonth.reduce((sum, r) => sum + r.price, 0);
  const budget = CONFIG.BUDGET;
  const remaining = budget - spent;
  const pct = Math.round((spent / budget) * 100);
  const daysLeft = getDaysRemaining();
  const status = getBudgetStatus(pct);

  const gradientClass = pct >= 90 ? 'gradient-error' : pct >= 70 ? 'gradient-warning' : 'text-gradient';
  const barColor = pct >= 90
    ? 'bg-gradient-to-r from-error to-primary-container'
    : pct >= 70
      ? 'bg-gradient-to-r from-tertiary to-tertiary-container'
      : 'bg-gradient-to-r from-primary to-secondary';

  document.getElementById('budget-gauge').innerHTML = `
    <h3 class="font-headline font-bold text-[10px] uppercase tracking-[0.15em] text-on-surface-variant mb-6">Budget Gauge</h3>
    <div class="flex items-baseline gap-2 mb-1">
      <span class="text-5xl font-extrabold font-headline tracking-tighter ${gradientClass}">${formatKRW(spent)}</span>
      <span class="text-on-surface-variant font-medium text-sm">/ ${formatKRW(budget)}</span>
    </div>
    <p class="text-xs text-on-surface-variant mb-6">${pct}% of monthly budget utilized</p>
    <div class="w-full h-3 bg-surface-container-high rounded-full overflow-hidden mb-6">
      <div class="h-full ${barColor} rounded-full transition-all duration-700" style="width:${Math.min(pct, 100)}%"></div>
    </div>
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full ${pct >= 90 ? 'bg-error' : pct >= 70 ? 'bg-tertiary' : 'bg-primary'}"></div>
        <span class="text-[10px] font-bold">Remaining: ${formatKRWFull(remaining)}</span>
      </div>
      <span class="text-[10px] font-bold py-1 px-3 ${status.bgClass} ${status.textClass} rounded-full">${daysLeft} Days Left</span>
    </div>
  `;
}

// ── Monthly Chart ──────────────────────────────────────
function renderMonthlyChart() {
  const monthly = groupByMonth(officeSnacks);
  const last12 = monthly.slice(-12);
  if (last12.length === 0) { document.getElementById('monthly-chart').innerHTML = '<p class="text-on-surface-variant text-sm">No data</p>'; return; }

  const maxSpend = Math.max(...last12.map(m => m.total));
  const budgetLineHeight = Math.min((CONFIG.BUDGET / maxSpend) * 100, 100);

  let html = '';
  last12.forEach((m, i) => {
    const heightPct = (m.total / maxSpend) * 100;
    const gen = getGeneration(m.records[0]?.date);
    const budget = getBudgetForGen(gen);
    const overBudget = m.total > budget;
    const monthLabel = getMonthLabel(m.records[0]?.date);
    const barColor = overBudget ? '#c1272d' : (i % 2 === 0 ? '#2d8a4e' : '#d4a017');

    html += `
      <div class="flex-1 flex flex-col items-end min-w-0" style="height:100%">
        <div class="w-full flex-1 flex items-end">
          <div class="w-full rounded-t relative group hover:opacity-80 transition-all cursor-pointer"
               style="height:${heightPct}%; background:${barColor}; opacity:${overBudget ? 1 : 0.8}">
            <div class="absolute -top-10 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 bg-inverse-surface text-inverse-on-surface text-[10px] py-1 px-2 rounded transition-all whitespace-nowrap z-10">
              ${formatKRWFull(m.total)}
            </div>
          </div>
        </div>
        <span class="text-[8px] font-bold text-on-surface-variant uppercase leading-tight text-center mt-2 w-full">${monthLabel}<br/>${gen}</span>
      </div>
    `;
  });

  document.getElementById('monthly-chart').innerHTML = `
    <div class="relative w-full h-full flex items-end justify-between gap-2">
      <div class="absolute w-full border-t-2 border-dashed border-tertiary/40 z-10" style="bottom:${budgetLineHeight}%">
        <span class="absolute -top-4 right-0 text-[8px] font-bold text-tertiary">${formatKRW(CONFIG.BUDGET)}</span>
      </div>
      ${html}
    </div>
  `;
}

// ── Category Pie ───────────────────────────────────────
const CAT_COLORS = {
  '정기구독(스낵24)': '#2d8a4e', '음료': '#d4a017', '과자/스낵': '#e67e22',
  '과일': '#27ae60', '유제품/건강': '#8e7cc3', '계절간식': '#e67e22',
  '식사/간편식': '#bdc3c7', '혼합주문': '#95a5a6', '기타': '#7f8c8d',
};

function renderCategoryPie() {
  const period = document.getElementById('cat-period').value;
  let records = officeSnacks;
  if (period === 'current') {
    const { start, end } = getMonthRange(new Date());
    records = officeSnacks.filter(r => r.date >= start && r.date <= end);
  } else if (period === 'last') {
    const prev = new Date(); prev.setMonth(prev.getMonth() - 1);
    const { start, end } = getMonthRange(prev);
    records = officeSnacks.filter(r => r.date >= start && r.date <= end);
  } else if (period !== 'all') {
    const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth() - parseInt(period));
    records = officeSnacks.filter(r => r.date >= cutoff.toISOString().substring(0, 10));
  }

  const categories = groupByCategoryDetected(records);
  const sorted = Object.entries(categories).sort((a, b) => b[1].total - a[1].total);
  const total = records.reduce((s, r) => s + r.price, 0);

  if (total === 0) { document.getElementById('cat-pie-total').textContent = '₩0'; return; }
  document.getElementById('cat-pie-total').textContent = formatKRW(total);

  const radius = 40, circumference = 2 * Math.PI * radius;
  let offset = 0, circles = '';
  sorted.forEach(([name, data]) => {
    const pct = data.total / total;
    const dashLen = pct * circumference + 0.3;
    const color = CAT_COLORS[name] || '#95a5a6';
    circles += `<circle cx="50" cy="50" fill="transparent" r="${radius}" stroke="${color}" stroke-width="12" stroke-linecap="butt" stroke-dasharray="${dashLen.toFixed(2)} ${Math.max(0, circumference - dashLen).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"/>`;
    offset += pct * circumference;
  });
  document.getElementById('cat-pie').innerHTML = circles;

  // Legend — top 6, merge remaining into existing "기타" or add new
  const topCats = sorted.slice(0, 6);
  const rest = sorted.slice(6);
  if (rest.length > 0) {
    const restTotal = rest.reduce((s, [,d]) => s + d.total, 0);
    const existingEtc = topCats.findIndex(([n]) => n === '기타');
    if (existingEtc >= 0) {
      topCats[existingEtc][1] = { total: topCats[existingEtc][1].total + restTotal };
    } else {
      topCats.push(['기타', { total: restTotal }]);
    }
  }

  document.getElementById('cat-pie-legend').innerHTML = topCats.map(([name, data]) => {
    const pct = Math.round((data.total / total) * 100);
    const color = CAT_COLORS[name] || '#7f8c8d';
    return `<div class="flex items-center justify-between"><div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full shrink-0" style="background:${color}"></div><span class="text-sm font-medium">${name}</span></div><div class="text-right"><span class="text-sm font-bold">${pct}%</span> <span class="text-[10px] text-on-surface-variant">${formatKRW(data.total)}</span></div></div>`;
  }).join('');
}

// ── Quick Stats ────────────────────────────────────────
function renderQuickStats() {
  const now = new Date();
  const { start, end } = getMonthRange(now);
  const thisMonth = officeSnacks.filter(r => r.date >= start && r.date <= end);
  const count = thisMonth.length;
  const total = thisMonth.reduce((s, r) => s + r.price, 0);
  const avg = count > 0 ? Math.round(total / count) : 0;
  document.getElementById('stat-orders').textContent = count;
  document.getElementById('stat-avg').textContent = formatKRWFull(avg);
}

// ── Popular Items ──────────────────────────────────────
function renderPopularItems() {
  const freq = {};
  officeSnacks.forEach(r => {
    const items = r.name.split(',').map(s => s.trim()).filter(s => s && !s.match(/스낵24|대량|주문|구매|추가|정산|이용|이것저것/));
    items.forEach(item => {
      const key = normalizeItemName(item.replace(/\s+/g, ' ').substring(0, 20));
      if (key.length < 2) return;
      freq[key] = (freq[key] || 0) + 1;
    });
  });
  const top = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 5);

  document.getElementById('popular-list').innerHTML = top.map(([name, count], i) => {
    const medals = ['🥇', '🥈', '🥉', '4.', '5.'];
    const displayName = name.length > 12 ? name.substring(0, 12) + '...' : name;
    return `<div class="flex items-center justify-between"><div class="flex items-center gap-2"><span class="text-xs w-5">${medals[i]}</span><span class="text-sm font-medium">${displayName}</span></div><span class="text-[10px] text-on-surface-variant font-bold">${count}x</span></div>`;
  }).join('');
}

// ── Restock Reminder ───────────────────────────────────
function renderRestockReminder() {
  const now = new Date();
  const twoWeeksAgo = new Date(now - 14 * 24 * 60 * 60 * 1000).toISOString().substring(0, 10);

  // Count total occurrences of each item across ALL records
  const totalCount = {};
  const lastSeen = {};
  const recentItems = new Set();

  officeSnacks.forEach(r => {
    const items = r.name.split(',').map(s => s.trim()).filter(s => s && !s.match(/스낵24|대량|주문|구매|추가|정산|이용|이것저것/));
    items.forEach(item => {
      const key = normalizeItemName(item.replace(/\s+/g, ' ').substring(0, 20));
      if (key.length < 2) return;
      totalCount[key] = (totalCount[key] || 0) + 1;
      if (!lastSeen[key] || r.date > lastSeen[key]) lastSeen[key] = r.date;
      if (r.date >= twoWeeksAgo) recentItems.add(key);
    });
  });

  // Only items ordered 3+ times AND not ordered in last 2 weeks
  const needRestock = Object.entries(lastSeen)
    .filter(([key]) => !recentItems.has(key) && (totalCount[key] || 0) >= 3)
    .sort((a, b) => b[1].localeCompare(a[1]))
    .slice(0, 5);

  if (needRestock.length === 0) {
    document.getElementById('restock-list').innerHTML = '<p class="text-xs text-on-surface-variant">All stocked up! No items overdue.</p>';
    return;
  }

  document.getElementById('restock-list').innerHTML = needRestock.map(([name, lastDate]) => {
    const daysAgo = Math.round((now - new Date(lastDate)) / (24 * 60 * 60 * 1000));
    return `<div class="flex items-center justify-between"><span class="text-xs font-medium">${name}</span><span class="text-[10px] text-tertiary font-bold">${daysAgo}d ago</span></div>`;
  }).join('');
}

// ── Recent Purchases ───────────────────────────────────
function renderRecentList() {
  const recent = allRecords.slice(0, 5);
  const icons = { 'Office Snacks': 'shopping_bag', 'Bi-weekly': 'restaurant', 'Happy Hour': 'local_bar', 'Other Events': 'celebration' };

  document.getElementById('recent-list').innerHTML = recent.map(r => {
    const icon = icons[r.event] || 'receipt_long';
    return `<div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center text-primary shrink-0"><span class="material-symbols-outlined text-sm">${icon}</span></div><div class="flex-1 min-w-0"><p class="text-xs font-bold truncate">${r.name}</p><p class="text-[10px] text-on-surface-variant">${formatDate(r.date)}</p></div><span class="text-[10px] font-bold text-on-surface-variant shrink-0">${formatKRWFull(r.price)}</span></div>`;
  }).join('');
}

// ── Purchase History ───────────────────────────────────
function renderHistoryTable(filterText = '', filterEvent = '') {
  let filtered = allRecords;
  if (filterText) { const q = filterText.toLowerCase(); filtered = filtered.filter(r => r.name.toLowerCase().includes(q) || r.vendor.toLowerCase().includes(q)); }
  if (filterEvent) filtered = filtered.filter(r => r.event === filterEvent);

  if (filtered.length === 0) { document.getElementById('history-table').innerHTML = '<p class="text-on-surface-variant text-xs py-4">No matching records</p>'; return; }

  const eventColors = { 'Office Snacks': 'primary', 'Bi-weekly': 'secondary', 'Happy Hour': 'tertiary' };
  document.getElementById('history-table').innerHTML = `
    <table class="w-full"><thead><tr class="text-left text-[9px] uppercase tracking-widest text-on-surface-variant font-bold">
      <th class="pb-3 pr-3">Date</th><th class="pb-3 pr-3">Item</th><th class="pb-3 pr-3 text-right">Price</th><th class="pb-3 pr-3">Event</th><th class="pb-3">Vendor</th>
    </tr></thead><tbody>${filtered.map(r => {
      const c = eventColors[r.event] || 'outline';
      return `<tr class="border-t border-outline-variant/10 hover:bg-surface-container-low/50"><td class="py-2.5 pr-3 text-xs text-on-surface-variant whitespace-nowrap">${formatDate(r.date)}</td><td class="py-2.5 pr-3 text-xs font-medium max-w-[200px] truncate">${r.name}</td><td class="py-2.5 pr-3 text-xs font-bold text-right whitespace-nowrap">${formatKRWFull(r.price)}</td><td class="py-2.5 pr-3"><span class="text-[9px] font-bold py-0.5 px-2 bg-${c}/10 text-${c} rounded-full">${r.event}</span></td><td class="py-2.5 text-xs text-on-surface-variant">${r.vendor}</td></tr>`;
    }).join('')}</tbody></table>`;
}

// ── Events ─────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', (e) => renderHistoryTable(e.target.value, document.getElementById('event-filter').value));
document.getElementById('event-filter').addEventListener('change', (e) => renderHistoryTable(document.getElementById('search-input').value, e.target.value));

// ── Snack Request Form ─────────────────────────────────
document.getElementById('snack-request-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const status = document.getElementById('req-status');
  const btn = e.target.querySelector('button[type="submit"]');
  const name = document.getElementById('req-name').value.trim();
  const snack = document.getElementById('req-snack').value.trim();
  const link = document.getElementById('req-link').value.trim();

  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const res = await fetch('/api/request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, snack, link }),
    });
    const data = await res.json();

    if (data.ok) {
      status.className = 'text-xs text-center py-2 rounded-lg font-headline bg-secondary/10 text-secondary';
      status.textContent = 'Sent to #happy-nyam-nyam!';
      e.target.reset();
    } else {
      status.className = 'text-xs text-center py-2 rounded-lg font-headline bg-error/10 text-error';
      status.textContent = data.error || 'Failed to send';
    }
  } catch (err) {
    status.className = 'text-xs text-center py-2 rounded-lg font-headline bg-error/10 text-error';
    status.textContent = 'Network error';
  }

  status.classList.remove('hidden');
  btn.disabled = false;
  btn.textContent = 'Send to #happy-nyam-nyam';
  setTimeout(() => status.classList.add('hidden'), 5000);
});

init();
</script>
